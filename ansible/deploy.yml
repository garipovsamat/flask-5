---
- name: Deploy Flask application with k3s and Helm
  hosts: all
  become: yes
  vars:
    app_name: "flask-app"
    namespace: "flask-app"
    dockerhub_username: "samatgaripov"
    image_tag: "final"
    
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
        
    - name: Install dependencies
      apt:
        name:
          - curl
          - git
          - python3-pip
          - docker.io
        state: present
        
    - name: Install k3s
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s
        
    - name: Wait for k3s to be ready
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 60
        
    - name: Set kubeconfig permissions
      shell: |
        mkdir -p /root/.kube
        cp /etc/rancher/k3s/k3s.yaml /root/.kube/config
        chmod 600 /root/.kube/config
        
    - name: Install Helm
      shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm
        
    # - name: Pull Docker image
    #   shell: |
    #     docker pull {{ dockerhub_username }}/{{ app_name }}:{{ image_tag }}
        
    # - name: Save and import image to containerd
    #   shell: |
    #     docker save {{ dockerhub_username }}/{{ app_name }}:{{ image_tag }} -o /tmp/{{ app_name }}.tar
    #     ctr -n k8s.io image import /tmp/{{ app_name }}.tar
    #   ignore_errors: yes
      
    - name: Create namespace
      shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        kubectl create namespace {{ namespace }} --dry-run=client -o yaml | kubectl apply -f -
        
    - name: Clone repository to VM
      git:
        repo: https://github.com/garipovsamat/flask-5.git
        dest: /root/flask-5
        version: main

    - name: Force reinstall Helm chart
      shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        helm uninstall {{ app_name }} -n {{ namespace }} || true

    - name: Deploy with Helm
      shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        helm upgrade --install {{ app_name }} /root/flask-5/flask-chart \
          --namespace {{ namespace }} \
          --set image.repository={{ dockerhub_username }}/{{ app_name }} \
          --set image.tag={{ image_tag }} \
          --set image.pullPolicy=IfNotPresent
      args:
        chdir: /root/flask-5
        
    - name: Wait for pods
      shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        kubectl wait --for=condition=ready pod -l app={{ app_name }} -n {{ namespace }} --timeout=60s
      ignore_errors: yes
      
    - name: Show service info
      shell: |
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        kubectl get svc -n {{ namespace }}
      register: svc_info
      
    - name: Display service info
      debug:
        msg: "{{ svc_info.stdout }}"

    - name: Install ArgoCD
      shell: |
        kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=120s

    - name: Get ArgoCD password
      shell: |
        kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
      register: argocd_password

    - name: Show ArgoCD password
      debug:
        msg: "ArgoCD admin password: {{ argocd_password.stdout }}"

    - name: Patch ArgoCD server service to NodePort
      shell: |
        kubectl patch svc argocd-server -n argocd -p '{"spec":{"type":"NodePort"}}'
      ignore_errors: yes

    - name: Get ArgoCD NodePort
      shell: |
        kubectl get svc argocd-server -n argocd -o jsonpath='{.spec.ports[?(@.port==443)].nodePort}'
      register: argocd_nodeport

    - name: Show ArgoCD access URL
      debug:
        msg: "ArgoCD доступен по адресу: https://{{ ansible_default_ipv4.address }}:{{ argocd_nodeport.stdout }}"