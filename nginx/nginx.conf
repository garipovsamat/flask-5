events {
    worker_connections 1024;
}

http {
    upstream flask_app {
        server app:5000;
    }

    # Кеширование на стороне Nginx
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # Лимиты для кеша
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # Основная локация для API
        location / {
            # Ограничение скорости запросов
            limit_req zone=mylimit burst=20 nodelay;

            # Настройки прокси
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Настройки кеширования для GET запросов
            proxy_cache my_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 302 5m;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            # Добавляем заголовки для отладки кеша
            add_header X-Cache-Status $upstream_cache_status;
            add_header X-RateLimit-Limit 10;
            
            # Пропускаем кеширование для не-GET запросов
            proxy_no_cache $request_method !~ ^(GET|HEAD)$;
            proxy_cache_bypass $request_method !~ ^(GET|HEAD)$;

            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Локация для health check (не кешируем)
        location /health {
            proxy_pass http://flask_app;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # Статика
        location /static {
            alias /app/static;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Мониторинг кеша
        location /cache-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }

        # Обработка ошибок
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}